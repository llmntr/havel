<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame VR Scene</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ngokevin/aframe-look-at-component@3.0.0/dist/aframe-look-at-component.min.js"></script>
    <script>
        // Custom component strictly for thumbstick locomotion
        AFRAME.registerComponent('thumbstick-movement', {
            schema: { speed: {type: 'number', default: 2.5} },
            init: function () {
                this.axisX = 0;
                this.axisY = 0;
                this.el.addEventListener('thumbstickmoved', this.onThumbstickMoved.bind(this));
            },
            onThumbstickMoved: function (evt) {
                this.axisX = Math.abs(evt.detail.x) > 0.05 ? evt.detail.x : 0;
                this.axisY = Math.abs(evt.detail.y) > 0.05 ? evt.detail.y : 0;
            },
            tick: function (time, delta) {
                if (this.axisX === 0 && this.axisY === 0) return;
                var rig = document.querySelector('#cameraRig');
                var camera = document.querySelector('#camera');
                if (!rig || !camera) return;

                var rotation = camera.getAttribute('rotation');
                var angle = rotation.y * Math.PI / 180;
                var deltaX = this.axisX * this.data.speed * (delta / 1000);
                var deltaZ = this.axisY * this.data.speed * (delta / 1000);

                var moveX = deltaX * Math.cos(angle) + deltaZ * Math.sin(angle);
                var moveZ = deltaZ * Math.cos(angle) - deltaX * Math.sin(angle);

                var pos = rig.getAttribute('position');
                pos.x += moveX;
                pos.z += moveZ;
                rig.setAttribute('position', pos);
            }
        });

        AFRAME.registerComponent('sprite-sheet-anim', {
            schema: {
                rows: {type: 'int', default: 1},
                columns: {type: 'int', default: 5},
                frameRate: {type: 'number', default: 6},
                loop: {type: 'boolean', default: true}
            },
            init: function () {
                const material = this.el.getObject3D('mesh').material;
                if (material) {
                    material.transparent = true;
                    material.alphaTest = 0.5;
                    material.depthWrite = false;
                }
                this.currentFrame = 0;
                this.elapsed = 0;
                this.frameDuration = 1000 / this.data.frameRate;
                this.totalFrames = this.data.rows * this.data.columns;
                this.el.setAttribute('material', 'repeat', `${1 / this.data.columns} ${1 / this.data.rows}`);
                this.updateFrame();
                this.pauseAnim = false;
            },
            tick: function (time, delta) {
                if (this.pauseAnim) return;
                this.elapsed += delta;
                if (this.elapsed < this.frameDuration) { return; }
                this.elapsed -= this.frameDuration;
                this.currentFrame = (this.currentFrame + 1) % this.totalFrames;
                this.updateFrame();
            },
            updateFrame: function () {
                const column = this.currentFrame % this.data.columns;
                const row = Math.floor(this.currentFrame / this.data.columns);
                this.el.setAttribute('material', 'offset', `${column / this.data.columns} ${(this.data.rows - 1 - row) / this.data.rows}`);
            }
        });

        AFRAME.registerComponent('face-camera', {
            init: function () {
                this.cameraEl = document.querySelector('#camera');
                this.targetPosition = new THREE.Vector3();
                this.selfPosition = new THREE.Vector3();
                this.direction = new THREE.Vector3();
            },
            tick: function () {
                if (!this.cameraEl || !this.cameraEl.object3D) { return; }
                this.cameraEl.object3D.getWorldPosition(this.targetPosition);
                this.el.object3D.getWorldPosition(this.selfPosition);
                this.direction.copy(this.targetPosition).sub(this.selfPosition);
                var angle = Math.atan2(this.direction.x, this.direction.z) * 180 / Math.PI;
                this.el.setAttribute('rotation', {x: 0, y: angle, z: 0});
            }
        });

        AFRAME.registerComponent('random-walker', {
            schema: {
                radius: {type: 'number', default: 15},
                speed: {type: 'number', default: 1},
                changeInterval: {type: 'number', default: 3000}
            },
            init: function () {
                this.target = new THREE.Vector3();
                this.direction = new THREE.Vector3();
                this.elapsed = 0;
                this.pauseWalker = false;
                this.setNewTarget();
            },
            setNewTarget: function () {
                var x = (Math.random() * 2 - 1) * this.data.radius;
                var z = (Math.random() * 2 - 1) * this.data.radius;
                this.target.set(x, 0, z);
                var pos = this.el.getAttribute('position');
                this.direction.set(this.target.x - pos.x, 0, this.target.z - pos.z);
                this.direction.y = 0;
                var distance = this.direction.length();
                if (distance > 0.001) {
                    this.direction.normalize();
                    var angle = Math.atan2(this.direction.x, this.direction.z) * 180 / Math.PI;
                    this.el.setAttribute('rotation', {x: 0, y: angle, z: 0});
                }
            },
            tick: function (time, delta) {
                if (this.pauseWalker) return;
                var pos = this.el.getAttribute('position');
                var moveDistance = this.data.speed * (delta / 1000);
                pos.x += this.direction.x * moveDistance;
                pos.z += this.direction.z * moveDistance;
                this.el.setAttribute('position', pos);
                this.elapsed += delta;
                var dx = this.target.x - pos.x;
                var dz = this.target.z - pos.z;
                var distance = Math.sqrt(dx * dx + dz * dz);
                if (distance < 0.2 || this.elapsed > this.data.changeInterval) {
                    this.elapsed = 0;
                    this.setNewTarget();
                }
            }
        });

        AFRAME.registerComponent('proximity-pause', {
            schema: { distance: {type: 'number', default: 3} },
            init: function () {
                this.cameraEl = document.querySelector('#camera');
                this.camPos = new THREE.Vector3();
                this.worldPos = new THREE.Vector3();
            },
            tick: function () {
                if (!this.cameraEl || !this.cameraEl.object3D) return;
                
                this.cameraEl.object3D.getWorldPosition(this.camPos);
                this.el.object3D.getWorldPosition(this.worldPos);
                var isNear = this.worldPos.distanceTo(this.camPos) < this.data.distance;
                
                if (this.el.components['random-walker']) {
                    this.el.components['random-walker'].pauseWalker = isNear;
                }
                
                if (!this.planeEl) {
                    this.planeEl = this.el.querySelector('.interactive');
                }
                if (this.planeEl && this.planeEl.components['sprite-sheet-anim']) {
                    var anim = this.planeEl.components['sprite-sheet-anim'];
                    if (isNear && !anim.pauseAnim) {
                        anim.pauseAnim = true;
                        anim.currentFrame = 0;
                        anim.updateFrame();
                    } else if (!isNear && anim.pauseAnim) {
                        anim.pauseAnim = false;
                    }
                }
            }
        });

        AFRAME.registerComponent('character-spawner', {
            schema: { count: {type: 'int', default: 6}, radius: {type: 'number', default: 15} },
            init: function () {
                if (this.el.hasLoaded) {
                    this.spawnCharacters();
                } else {
                    this.el.addEventListener('loaded', this.spawnCharacters.bind(this));
                }
            },
            spawnCharacters: function () {
                var characterNames = [
                    "Havel s krátkými kalhotami", "Casual Havel", "Ha-V-el",
                    "Mladý Havel", "Havel s mikrofonem", "Vězeň Havel"
                ];

                for (var i = 0; i < this.data.count; i++) {
                    var x = (Math.random() * 2 - 1) * this.data.radius;
                    var z = (Math.random() * 2 - 1) * this.data.radius;
                    var character = document.createElement('a-entity');
                    
                    character.setAttribute('position', x + ' 0.8 ' + z);
                    character.setAttribute('face-camera', '');
                    character.setAttribute('random-walker', 'radius: ' + this.data.radius + '; speed: ' + (0.6 + Math.random() * 0.6) + '; changeInterval: ' + (2000 + Math.random() * 3000));
                    character.setAttribute('proximity-pause', 'distance: 3');

                    var plane = document.createElement('a-plane');
                    plane.setAttribute('class', 'interactive');
                    plane.setAttribute('width', '1');
                    plane.setAttribute('height', '1.6');
                    plane.setAttribute('data-audio-index', i + 1);
                    plane.setAttribute('data-name', characterNames[i]);
                    
                    var texture = 'assets/havel_walk_' + (i + 1) + '.png';
                    
                    plane.setAttribute('material', 'shader: flat; src: ' + texture + '; transparent: true; alphaTest: 0.5; repeat: 0.2 1');
                    plane.setAttribute('sprite-sheet-anim', 'rows: 1; columns: 5; frameRate: 6; loop: true');
                    plane.setAttribute('position', '0 0 0');
                    character.appendChild(plane);

                    this.el.appendChild(character);
                }
            }
        });

        AFRAME.registerComponent('quote-displayer', {
            init: function () {
                this.quotes = {};
                this.quoteGroup = document.querySelector('#quoteGroup');
                this.quoteText = document.querySelector('#quoteText');
                this.nameText = document.querySelector('#nameText');
                
                this.statsCharText = document.querySelector('#statsCharText');
                this.statsQuoteText = document.querySelector('#statsQuoteText');
                
                this.audioAssets = {};
                this.currentAudioIndex = null;
                this.currentName = "";
                this.lastInteractTime = 0;
                this.talkedToCharacters = new Set();
                this.heardQuotes = new Set();

                for (var i = 1; i <= 6; i++) {
                    var audio = document.createElement('audio');
                    audio.preload = 'auto';
                    audio.crossOrigin = 'anonymous';
                    audio.muted = false;
                    audio.volume = 1.0;

                    var exts = ['ogg', 'mp3', 'wav'];
                    for (var j = 0; j < exts.length; j++) {
                        var source = document.createElement('source');
                        source.src = 'assets/audio_1.' + exts[j];
                        source.type = 'audio/' + (exts[j] === 'mp3' ? 'mpeg' : exts[j]);
                        audio.appendChild(source);
                    }

                    audio.load();
                    this.audioAssets[i] = audio;
                    this.quotes[i] = [];
                    this.loadQuotes(i);
                }

                this.onInteract = this.onInteract.bind(this);
                
                var scene = document.querySelector('a-scene');
                if (scene) {
                    scene.addEventListener('click', this.onInteract);
                }

                var unlocked = false;
                var unlock = function () {
                    if (unlocked) return;
                    unlocked = true;
                    this.unlockAudio();
                }.bind(this);

                window.addEventListener('click', unlock, { once: true });
                window.addEventListener('touchstart', unlock, { once: true });
                if (scene) {
                    scene.addEventListener('enter-vr', unlock, { once: true });
                }
            },
            loadQuotes: function (index) {
                fetch('assets/citaty_' + index + '.txt')
                    .then(function (response) { return response.text(); })
                    .then(function (text) {
                        this.quotes[index] = text.split(/\r?\n/).map(function (line) { return line.trim(); }).filter(Boolean);
                    }.bind(this))
                    .catch(function (error) { console.warn('Could not load quotes for character ' + index); });
            },
            unlockAudio: function () {
                Object.keys(this.audioAssets).forEach(function (key) {
                    var audio = this.audioAssets[key];
                    audio.currentTime = 0;
                    audio.play().then(function () {
                        audio.pause();
                        audio.currentTime = 0;
                    }).catch(function () {});
                }.bind(this));
            },
            onInteract: function (evt) {
                var now = Date.now();
                if (now - this.lastInteractTime < 50) { return; }
                this.lastInteractTime = now;

                var target = evt.detail && evt.detail.intersectedEl ? evt.detail.intersectedEl : evt.target;
                if (!target || !target.classList || !target.classList.contains('interactive')) { return; }

                var cam = document.querySelector('#camera');
                if (!cam || !cam.object3D) { return; }

                var camPos = new THREE.Vector3();
                var charPos = new THREE.Vector3();
                cam.object3D.getWorldPosition(camPos);
                target.object3D.getWorldPosition(charPos);
                
                if (camPos.distanceTo(charPos) > 4) { return; }

                this.currentAudioIndex = target.getAttribute('data-audio-index');
                this.currentName = target.getAttribute('data-name');
                
                if (!this.quotes[this.currentAudioIndex] || !this.quotes[this.currentAudioIndex].length) { return; }

                this.followTarget = target;
                this.updateQuotePosition();
                this.showQuote();
            },
            tick: function () {
                if (this.followTarget && this.quoteGroup.getAttribute('visible')) {
                    this.updateQuotePosition();
                }
            },
            updateQuotePosition: function () {
                if (!this.followTarget || !this.followTarget.object3D) { return; }
                var targetPos = new THREE.Vector3();
                this.followTarget.object3D.getWorldPosition(targetPos);
                targetPos.y += 0.85;
                this.quoteGroup.setAttribute('position', targetPos.x + ' ' + targetPos.y + ' ' + targetPos.z);
            },
            showQuote: function () {
                var charQuotes = this.quotes[this.currentAudioIndex];
                if (!charQuotes || !charQuotes.length) { return; }
                var quote = charQuotes[Math.floor(Math.random() * charQuotes.length)];
                
                this.talkedToCharacters.add(this.currentAudioIndex);
                this.heardQuotes.add(quote);
                
                if (this.statsCharText) {
                    this.statsCharText.setAttribute('value', this.talkedToCharacters.size.toString());
                }
                if (this.statsQuoteText) {
                    this.statsQuoteText.setAttribute('value', this.heardQuotes.size.toString());
                }

                this.nameText.setAttribute('value', this.currentName);
                this.quoteText.setAttribute('value', quote);
                this.quoteGroup.setAttribute('visible', 'true');
                
                if (this.currentAudioIndex && this.audioAssets[this.currentAudioIndex]) {
                    var activeAudio = this.audioAssets[this.currentAudioIndex];
                    activeAudio.currentTime = 0;
                    activeAudio.play().catch(function () {});
                }

                clearTimeout(this.hideTimeout);
                this.hideTimeout = setTimeout(function () {
                    this.quoteGroup.setAttribute('visible', 'false');
                    this.followTarget = null;
                }.bind(this), 20000);
            },
            remove: function () {
                var scene = document.querySelector('a-scene');
                if (scene) {
                    scene.removeEventListener('click', this.onInteract);
                }
                clearInterval(this.interval);
                clearTimeout(this.hideTimeout);
            }
        });
    </script>
</head>
<body>
    <a-scene character-spawner="count: 6; radius: 32">
        <a-assets>
            <img id="panorama" src="assets/panorama1.png" crossorigin="anonymous" />
            <img id="groundTexture" src="assets/tile.png" crossorigin="anonymous" />
        </a-assets>

        <a-entity id="cameraRig" position="0 -0.5 0">
            <a-entity id="camera" camera position="0 1.6 0" look-controls wasd-controls="acceleration: 50">
                <a-entity id="hud" position="0 -0.6 -1.2" scale="0.5 0.5 0.5" quote-displayer>
                    <a-plane width="2.4" height="0.15" color="#000" opacity="0.6" position="0 -0.025 -0.01"></a-plane>
                    
                    <a-text material="msdf" align="right" position="-0.4 0 0" 
                            value="Havlové potkáni:" width="2.4" wrap-count="60" color="#aaaaaa" 
                            font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>
                    <a-text id="statsCharText" material="msdf" align="right" position="-0.3 0 0" 
                            value="0" width="2.4" wrap-count="60" color="#ffffff" 
                            font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>
                    <a-text material="msdf" align="left" position="-0.3 0 0" 
                            value="/6" width="2.4" wrap-count="60" color="#aaaaaa" 
                            font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>

                    <a-text material="msdf" align="center" position="0.16 0 0" 
                            value="|" width="2.4" wrap-count="60" color="#555555" 
                            font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>

                    <a-text material="msdf" align="right" position="0.75 0 0" 
                            value="Vyslechnutá moudra:" width="2.4" wrap-count="60" color="#aaaaaa" 
                            font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>
                    <a-text id="statsQuoteText" material="msdf" align="right" position="0.85 0 0" 
                            value="0" width="2.4" wrap-count="60" color="#ffffff" 
                            font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>
                    <a-text material="msdf" align="left" position="0.85 0 0" 
                            value="/36" width="2.4" wrap-count="60" color="#aaaaaa" 
                            font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>
                </a-entity>
            </a-entity>

            <a-entity laser-controls="hand: left" raycaster="objects: .interactive; far: 5"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .interactive; far: 5" thumbstick-movement="speed: 2.5"></a-entity>
        </a-entity>

        <a-entity id="quoteGroup" position="0 2.4 -2" scale="0.5 0.5 0.5" visible="false" face-camera>
            <a-plane width="2.6" height="1.0" color="#000" opacity="0.6" position="0 0 0"></a-plane>
            <a-text id="nameText" material="msdf" align="center" position="0 0.3 0.01" value="Name" width="2.8" color="#ffffff" font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>
            <a-text id="quoteText" material="msdf" align="center" position="0 -0.1 0.01" value="" width="2.4" color="#aaaaaa" font="assets/Tiny5-Regular-msdf.json" font-image="assets/Tiny5-Regular.png" negate="false"></a-text>
        </a-entity>

        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" material="shader: flat; src: #groundTexture; repeat: 50 50"></a-plane>
        <a-sky src="#panorama" rotation="0 180 0"></a-sky>
    </a-scene>
</body>
</html>
