<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame VR Scene</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Green ground plane -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="green"></a-plane>
        
        <!-- Blue sky -->
        <a-sky color="blue"></a-sky>
    </a-scene>
</body>
</html>
